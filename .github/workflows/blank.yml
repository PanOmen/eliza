name: Uruchom bota PanOmen
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Uruchomienie procesu Pump.fun
        run: |
          echo "Inicjalizacja darmowego tokenu dla profilu coinmupets..."
          curl -X POST https://pumpportal.fun \
            -H "Content-Type: application/json" \
            -d '{
              "action": "create",
              "tokenMetadata": {
                "name": "PanOmen AI",
                "symbol": "WHISPER",
                "description": "Official AI Agent Token for coinmupets profile.",
                "twitter": "https://x.com",
                "website": "https://pump.fun/profile/coinmupets"
              }
            }'
